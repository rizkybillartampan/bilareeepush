* {

/* CENTER WRAPPER */
.wrapper {

.slider-box {

.slides img {

}

/* nav */
.btn-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  font-size: 18px;
  padding: 10px 12px;
  cursor: pointer;
  border-radius: 50%;
}

.prev { left: 10px; }
.next { right: 10px; }


.box {
  width: 100%;
  max-width: 420px;

  background: rgba(40,40,40,0.85);
  border-radius: 16px;
  padding: 18px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  text-align: center;
  backdrop-filter: blur(6px);
}

/* RUNNING TEXT */
.marquee {
  position: sticky;
  top: 0px;   /* jarak dari atas saat scroll */
  z-index: 999;

  overflow: hidden;
  white-space: nowrap;

  background: rgba(255,255,255,0.08);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;

  backdrop-filter: blur(6px);
}

.marquee span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll 40s linear infinite;
  font-size: 13px;
  color: #facc15;
}

@keyframes scroll {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}


.btn {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
  transition: 0.2s;
  color: white;
  position: relative; /* penting untuk HOT badge */
  overflow: hidden;
}





.btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent
  );

  transform: skewX(-20deg);
  pointer-events: none;

  animation: shineMove 3s infinite;
}

/* animasi kilat kiri → kanan */
@keyframes shineMove {
  0% {
    left: -75%;
  }
  100% {
    left: 130%;
  }
}

/* warna */



.btn-vip {
  background: linear-gradient(45deg, #fffcf9 0%, #efb33b 25%, #c39d4e 55%, #8a6a2f 75%, #36222e 100%);
}

.btn-ref {
  background: linear-gradient(45deg, #fffcf9 0%, #efb33b 25%, #c39d4e 55%, #8a6a2f 75%, #36222e 100%);
}

.btn-wa {
  background: linear-gradient(45deg, #fffcf9 0%, #efb33b 25%, #c39d4e 55%, #8a6a2f 75%, #36222e 100%);
}






.hot::after {

  top: 6px;
  right: 6px;

  color: white;
  font-size: 10px;
  padding: 3px 6px;

}

@keyframes shakePause {
  0% { transform: translateX(0); }
  5% { transform: translateX(-2px); }
  10% { transform: translateX(2px); }
  15% { transform: translateX(-2px); }
  20% { transform: translateX(2px); }

  /* berhenti lama */
  100% { transform: translateX(0); }
}

.hot {
  animation: shakePause 2.5s infinite;
  display: inline-block;

/* hover biar makin hidup */
.btn:hover {

/* GRID 2 KOLOM */
/* GRID */
.grid {

  margin: 20px auto;

  grid-template-columns: repeat(2, 1fr);
  gap: 12px;

/* CARD */
.card {
  display: block;
  text-decoration: none;
  color: white;

  background: rgba(30,30,30,0.9);
  border-radius: 14px;
  overflow: hidden;

.card:hover {

/* IMAGE */
.card img {
  width: 100%;
  height: 120px;

  object-position: center;
  
  transform: scale(1.05);

  filter: brightness(1.1) contrast(1.1);
  transition: 0.3s ease;

  border-bottom: 1px solid rgba(255,255,255,0.1);

.card:hover img {
  transform: scale(1.12);

/* TEXT */

let index = 0;

window.showSlide = function (i) {

  const slides =
    document.getElementById(
      "slides"
    );

  if (!slides) return;

  const total =
    slides.children.length;

  if (total <= 0) return;

  if (i < 0) {

    index =
      total - 1;

  }

  else if (
    i >= total
  ) {

    index = 0;

  }

  else {

    index = i;

  }

  slides.style.transform =
    `translateX(-${index * 100}%)`;

};

window.nextSlide =
function () {

  showSlide(
    index + 1
  );

};

window.prevSlide =
function () {

  showSlide(
    index - 1
  );

};



let sliderTimer =
null;

function startSlider() {

  if (sliderTimer) {

    clearInterval(
      sliderTimer
    );

  }

  sliderTimer =
    setInterval(() => {

      const slides =
        document.getElementById(
          "slides"
        );

      if (
        !slides
      ) return;

      if (
        slides.children
          .length > 1
      ) {

        nextSlide();

      }

    }, 4500);

}
