async function loadBannerAdmin(){

const tbody =
document.getElementById(
"bannerTable"
);

tbody.innerHTML="";

const snap =
await get(
ref(db,"banners")
);

if(!snap.exists()){

document.getElementById(
"totalBanner"
).innerText = 0;

return;

}

let total = 0;

snap.forEach(item=>{

total++;

const data =
item.val();

tbody.innerHTML += `

<tr>

<td>
<img
src="${data.image}"
width="80">
</td>

<td>
${data.order || 0}
</td>

</button>

</td>

</tr>

`;

});

document.getElementById(
"totalBanner"
).innerText =
total;

}

);

await loadBannerAdmin();

};

document.getElementById("addButton").onclick = async () => {
  try {
    const title = document.getElementById("buttonTitle").value.trim();
    const url = document.getElementById("buttonUrl").value.trim();
    const className = document.getElementById("buttonClass").value.trim();
    const order = Number(document.getElementById("buttonOrder").value || 0);

    if (!title || !url) {
      alert("Judul & URL wajib diisi");
      return;
    }

    await push(ref(db, "buttons"), {
      title,
      url,
      className,
      order,
      newTab: true,


  
    });

    document.getElementById("buttonTitle").value = "";
    document.getElementById("buttonUrl").value = "";
    document.getElementById("buttonClass").value = "";
    document.getElementById("buttonOrder").value = "";

    alert("Button berhasil ditambahkan");

    await loadButtonsAdmin();

  } catch (err) {
    console.error(err);
    alert(err.message);
  }
};

async function loadButtonsAdmin() {
  try {
    const tbody = document.getElementById("buttonTable");
    const preview = document.getElementById("buttonPreview");

    tbody.innerHTML = "";
    if (preview) preview.innerHTML = "";

    const snap = await get(ref(db, "buttons"));

    if (!snap.exists()) {
      document.getElementById("totalButtons").innerText = "0";
      return;
    }

    const data = snap.val();

    const arr = Object.keys(data)
      .map(id => ({
        id,
        ...data[id]
      }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));

    document.getElementById("totalButtons").innerText = arr.length;

    arr.forEach(item => {

      // ======================
      // ADMIN TABLE (VIEW + DELETE)
      // ======================
      tbody.innerHTML += `
        <tr>
          <td>${item.title || ""}</td>
          <td>${item.url || ""}</td>

          <td>
            <button class="delete-btn" onclick="deleteButton('${item.id}')">
              Hapus
            </button>
          </td>
        </tr>
      `;

      // ======================
      // USER PREVIEW (SAMA SEPERTI USER)
      // ======================
      if (preview) {
        preview.innerHTML += `
          <a class="btn"
            href="${item.url || "#"}"
            target="${item.newTab ? "_blank" : "_self"}"
            onclick="increaseView('${item.id}')">
            ${item.title || "BUTTON"}
          </a>
        `;
      }

    });

  } catch (err) {
    console.error("LOAD BUTTON ERROR:", err);
  }
}


window.deleteButton = async (id) => {
  try {
    if (!confirm("Hapus Button?")) return;

    await remove(ref(db, "buttons/" + id));

    alert("Button berhasil dihapus");

    await loadButtonsAdmin();

  } catch (err) {
    console.error(err);
    alert(err.message);
  }
};
await loadButtonsAdmin();






async function loadCardsAdmin(){

try{

const tbody =
document.getElementById(
"cardTable"
);

const preview =
document.getElementById(
"cardPreview"
);

if(tbody){
tbody.innerHTML = "";
}

await get(
ref(db,"cards")
);

"totalCards"
).innerText = "0";

preview.innerHTML = `
<div style="
padding:20px;
text-align:center;
opacity:.7;
">
Belum ada card
</div>
`;

}

return;

}

const data =
snap.val();

const arr =
Object.keys(data)

.filter(id=>
data[id] &&
typeof data[id] === "object"
)

.map(id=>({

id,
...data[id]

}))

.sort(
(a,b)=>
(a.order || 0) -
(b.order || 0)
);

"totalCards"
).innerText =
arr.length;

console.log(

);

}catch(err){
